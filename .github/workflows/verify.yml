name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  uphold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B src/verify_snapshot.py stubs
      - name: silhouettes
        run: |
          if ls silhouette/instances/sil_*.json >/dev/null 2>&1; then python -B src/verify_silhouette.py silhouette/instances; fi
      - name: geometry
        run: |
          if [ -f silhouette/instances/sil_tentacled_geometry_default.json ]; then python -B src/verify_geometry_snapshot.py silhouette/instances/sil_tentacled_geometry_default.json; fi
      - name: detune
        run: |
          if ls detune/records/detune_*.json >/dev/null 2>&1; then python -B src/verify_detune.py detune/records; fi
      - name: moire
        run: |
          if ls moire-fields/moire_*.json >/dev/null 2>&1; then python -B src/verify_moire.py moire-fields; fi
      - name: counter-symbol
        run: |
          if [ -f tests/test_counter_symbol.py ] && [ -f src/counter_symbol.py ]; then python -m unittest tests.test_counter_symbol -v; fi
