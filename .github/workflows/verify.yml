# Uphold sealed carriers on every push / PR.
name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  uphold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Module A stubs
        run: python -B src/verify_snapshot.py stubs
      - name: Verify silhouettes (if present)
        run: |
          if [ -d silhouette/instances ] && ls silhouette/instances/sil_*.json >/dev/null 2>&1; then
            python -B src/verify_silhouette.py silhouette/instances
          else
            echo "No silhouette instances; skip"
          fi
      - name: Verify geometry snapshot (if present)
        run: |
          if [ -f silhouette/instances/sil_tentacled_geometry_default.json ]; then
            python -B src/verify_geometry_snapshot.py silhouette/instances/sil_tentacled_geometry_default.json
          else
            echo "No geometry snapshot; skip"
          fi
      - name: Verify Module C detune records (if present)
        run: |
          if [ -d detune/records ] && ls detune/records/detune_*.json >/dev/null 2>&1; then
            python -B src/verify_detune.py detune/records
          else
            echo "No detune records; skip"
          fi
      - name: Verify Module B moiré fields (if present)
        run: |
          if [ -d moire-fields ] && ls moire-fields/moire_*.json >/dev/null 2>&1; then
            python -B src/verify_moire.py moire-fields
          else
            echo "No moiré fields; skip"
          fi
      - name: Counter-Symbol unit tests (if present)
        run: |
          if [ -f tests/test_counter_symbol.py ] && [ -f src/counter_symbol.py ]; then
            python -m unittest tests.test_counter_symbol -v
          else
            echo "No counter-symbol module; skip"
          fi
