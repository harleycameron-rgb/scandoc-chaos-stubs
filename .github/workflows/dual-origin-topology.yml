name: Dual historical reference topology tests
on:
  pull_request:
    paths:
      - 'src/dual_origin_topology.py'
      - 'tests/test_dual_origin_topology.py'
      - '.github/workflows/dual-origin-topology.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify A/B/Omega fail-closed research comparison contract
        run: python -m unittest discover -s tests -p 'test_dual_origin_topology.py' -v
